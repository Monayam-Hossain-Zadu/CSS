<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >

    <title>Pico CSS</title>
</head>
<body>
    <div class="container">
    <h1>Pico CSS</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Aut delectus explicabo earum tenetur iure consequatur ut vitae fugiat omnis possimus.</p>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monayam</td>
                <td>21</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>Shubham</td>
                <td>22</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>Shubham</td>
                <td>22</td>
                <td>Male</td>
            </tr>
        </tbody>
    </table>
    <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email"><br>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password"><br>

        <input type="text" name="text" placeholder="Text" aria-label="Text">
        <input type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email">
        <input type="number" name="number" placeholder="Number" aria-label="Number">
        <input type="password" name="password" placeholder="Password" aria-label="Password">
        <input type="tel" name="tel" placeholder="Tel" aria-label="Tel" autocomplete="tel">
        <input type="url" name="url" placeholder="Url" aria-label="Url">

        <button>Submit</button>
    </form>
</div>
</body>
</html>
